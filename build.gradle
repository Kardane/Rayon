plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${mod_version}+${minecraft_version}"
group = maven_group

base {
    archivesName = archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://maven.nucleoid.xyz")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // 1.21.8 서버사이드 미니게임 개발용 Polymer 모듈
    modImplementation include("eu.pb4:polymer-core:${polymer_version}")
    modImplementation include("eu.pb4:polymer-virtual-entity:${polymer_version}")
    modImplementation include("eu.pb4:polymer-resource-pack:${polymer_version}")

    implementation "com.github.stephengold:Libbulletjme:${libbulletjme_version}"
    include "com.github.stephengold:Libbulletjme:${libbulletjme_version}"
}

loom {
    runs {
        server {
            server()
            name = 'Rayon Dedicated Server'
            runDir = 'run'
        }
    }
}

tasks.named('runServer') {
    notCompatibleWithConfigurationCache('Loom 실행 인자 파일은 clean 이후 다시 생성되어야 합니다.')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.add('-Xlint:deprecation')
}

def resourceProperties = [
        version           : version.toString(),
        minecraft_version : minecraft_version.toString(),
        loader_version    : loader_version.toString(),
        fabric_api_version: fabric_api_version.toString()
]

processResources {
    inputs.properties resourceProperties
    filesMatching('fabric.mod.json') {
        expand resourceProperties
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = archives_base_name
            from components.java
        }
    }
}
